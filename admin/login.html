<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/webp" sizes="512x512" href="/assets/brand/site-icon.webp" />
  <link rel="apple-touch-icon" href="/assets/brand/site-icon.webp" />
  <title>Login Admin - Gela Fácil</title>
  <meta name="robots" content="noindex, nofollow" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/admin/admin.css" />
  <link rel="stylesheet" href="/admin/refresh.css" />
</head>
<body>
  <div class="login-overlay">
    <div class="login-card">
      <div class="login-logo">
        <img src="/assets/brand/logo-transparente.svg" alt="Gela Facil" />
      </div>
      <h1>Bem-vindo de volta.</h1>
      <p class="login-sub">Sua vitrine começa por aqui. Entre para cuidar do catálogo.</p>
      <form class="login-form" id="login-form">
        <p class="login-error" id="login-error" role="alert">Usuário ou senha invalidos.</p>
        <div class="form-group">
          <label for="admin-user">Usuário</label>
          <input type="text" id="admin-user" autocomplete="username" required />
        </div>
        <div class="form-group">
          <label for="admin-pass">Senha</label>
          <div class="password-field">
            <input type="password" id="admin-pass" autocomplete="current-password" required />
            <button type="button" class="password-toggle" id="password-toggle" aria-label="Mostrar senha" aria-pressed="false">
              <svg class="password-icon-show" aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z" />
                <circle cx="12" cy="12" r="3" />
              </svg>
              <svg class="password-icon-hide" aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" hidden>
                <path d="m3 3 18 18" />
                <path d="M10.6 10.6a2 2 0 0 0 2.8 2.8" />
                <path d="M9.9 4.2A10.5 10.5 0 0 1 12 4c6.5 0 10 8 10 8a17.6 17.6 0 0 1-2.1 3.2" />
                <path d="M6.6 6.6C3.8 8.5 2 12 2 12s3.5 8 10 8a9.8 9.8 0 0 0 4.1-.9" />
              </svg>
            </button>
          </div>
        </div>
        <button type="submit" class="btn-login">Entrar</button>
      </form><a class="login-back" href="/">← Voltar ao site</a>
    </div>
  </div>
  <script src="/admin/login.js"></script>
</body>
</html>
