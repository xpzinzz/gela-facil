<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login Admin - Gela Facil</title>
  <meta name="robots" content="noindex, nofollow" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="admin.css" />
</head>
<body>
  <div class="login-overlay">
    <div class="login-card">
      <div class="login-logo">
        <img src="../assets/brand/logo-transparente.svg" alt="Gela Facil" />
      </div>
      <h1>Acesso administrativo</h1>
      <p class="login-sub">Entre para gerenciar produtos e estoque.</p>
      <form class="login-form" id="login-form">
        <p class="login-error" id="login-error">Usuario ou senha invalidos.</p>
        <div class="form-group">
          <label for="admin-user">Usuario</label>
          <input type="text" id="admin-user" autocomplete="username" required />
        </div>
        <div class="form-group">
          <label for="admin-pass">Senha</label>
          <input type="password" id="admin-pass" autocomplete="current-password" required />
        </div>
        <button type="submit" class="btn-login">Entrar</button>
      </form>
    </div>
  </div>
  <script src="login.js"></script>
</body>
</html>
