<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login Admin - Gela Fácil</title>
  <meta name="robots" content="noindex, nofollow" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="admin.css" />
  <link rel="stylesheet" href="refresh.css" />
</head>
<body>
  <div class="login-overlay">
    <div class="login-card">
      <div class="login-logo">
        <img src="../assets/brand/logo-transparente.svg" alt="Gela Facil" />
      </div>
      <h1>Bem-vindo de volta.</h1>
      <p class="login-sub">Sua vitrine começa por aqui. Entre para cuidar do catálogo.</p>
      <form class="login-form" id="login-form">
        <p class="login-error" id="login-error" role="alert">Usuário ou senha invalidos.</p>
        <div class="form-group">
          <label for="admin-user">Usuário</label>
          <input type="text" id="admin-user" autocomplete="username" required />
        </div>
        <div class="form-group">
          <label for="admin-pass">Senha</label>
          <input type="password" id="admin-pass" autocomplete="current-password" required />
        </div>
        <button type="submit" class="btn-login">Entrar</button>
      </form><a class="login-back" href="/">← Voltar ao site</a>
    </div>
  </div>
  <script src="login.js"></script>
</body>
</html>
